name: Build and deploy SEO city pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate and validate all static city and commune pages
        run: npm run validate
      - name: Verify generated sitemap includes every commune
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const xml = readFileSync('sitemap.xml', 'utf8');
          const urls = [...xml.matchAll(/<loc>([^<]+)<\/loc>/g)].map((match) => match[1]);
          const communes = urls.filter((url) => url.includes('/weather/algeria/communes/') && !url.endsWith('/weather/algeria/communes/'));
          if (!xml.startsWith('<?xml') || !xml.includes('<urlset')) throw new Error('Generated sitemap is not a sitemap XML document');
          if (communes.length !== 1708) throw new Error(`Expected 1,708 commune URLs in generated sitemap; found ${communes.length}`);
          if (new Set(urls).size !== urls.length) throw new Error('Generated sitemap contains duplicate URLs');
          if (urls.length !== 2001) throw new Error(`Expected 2,001 total sitemap URLs including the communes directory; found ${urls.length}`);
          console.log(`Generated sitemap verified: ${communes.length} commune URLs plus directory / ${urls.length} total URLs`);
          NODE
      - name: Verify complete generated HTML output
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readdirSync } from 'node:fs';
          import { join } from 'node:path';
          const countIndexPages = (directory) => readdirSync(directory, { withFileTypes: true }).reduce((total, entry) => {
            const path = join(directory, entry.name);
            return total + (entry.isDirectory() ? countIndexPages(path) : entry.isFile() && entry.name === 'index.html' ? 1 : 0);
          }, 0);
          const expected = { algeria: 69, arab: 22, world: 195, communes: 1708, directories: 5 };
          const actual = {
            algeria: countIndexPages('weather/algeria') - countIndexPages('weather/algeria/communes') - 1,
            arab: countIndexPages('weather/arab') - 1,
            world: countIndexPages('weather/world') - 1,
            communes: countIndexPages('weather/algeria/communes') - 1,
            directories: ['weather/index.html', 'weather/algeria/index.html', 'weather/algeria/communes/index.html', 'weather/arab/index.html', 'weather/world/index.html'].filter(existsSync).length
          };
          for (const [key, count] of Object.entries(expected)) {
            if (actual[key] !== count) throw new Error(`${key}: expected ${count} generated pages, found ${actual[key]}`);
          }
          const weatherPages = countIndexPages('weather');
          if (weatherPages !== 1999) throw new Error(`Expected 1,999 weather index.html files including the communes directory, found ${weatherPages}`);
          if (!existsSync('sitemap.html') || !existsSync('data/global-search-index.json')) throw new Error('Generated sitemap/search index output is missing');
          console.log('Generated output verified:', JSON.stringify({ ...actual, weatherPages, totalHtmlPages: weatherPages + 2 }));
          NODE
      - name: Create pull request for generated pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/generated-city-pages
          delete-branch: false
          commit-message: 'chore: commit generated city and commune pages'
          title: 'chore: commit all generated weather HTML pages'
          body: |
            ## Generated weather pages

            This PR stores the complete output of `scripts/generate-city-pages.mjs` in the repository so generated HTML files are visible in the `main` tree as well as deployed through GitHub Pages.

            Included output:
            - 69 Algerian wilaya pages
            - 22 Arab capital pages
            - 195 world city/capital pages
            - 1,708 Algerian commune pages
            - 4 weather directory pages
            - `sitemap.html`, `sitemap.xml`, and `data/global-search-index.json`

            Generated output is staged only after `npm run validate` and the exact page-count checks pass. No generated files are pushed directly to `main`.
          add-paths: |
            weather/
            sitemap.html
            sitemap.xml
            data/global-search-index.json
      - name: Confirm generated output has no unstaged changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: git status --short
      - name: Upload generated GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository for published-page verification
        uses: actions/checkout@v4
      - name: Set up Node.js for published-page verification
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy generated GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify sitemap and robots on the published GitHub Pages site
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.PAGES_URL.replace(/\/$/, '');
          const sitemapUrl = base + '/sitemap.xml';
          const robotsUrl = base + '/robots.txt';
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          let lastError;
          for (let attempt = 1; attempt <= 12; attempt++) {
            try {
              const cacheBust = `?verify=${process.env.GITHUB_SHA}-${attempt}`;
              const [sitemapResponse, robotsResponse] = await Promise.all([
                fetch(sitemapUrl + cacheBust, { cache: 'no-store', headers: { 'Cache-Control': 'no-cache' } }),
                fetch(robotsUrl + cacheBust, { cache: 'no-store', headers: { 'Cache-Control': 'no-cache' } })
              ]);
              if (!sitemapResponse.ok) throw new Error(`Published sitemap HTTP ${sitemapResponse.status}`);
              if (!robotsResponse.ok) throw new Error(`Published robots.txt HTTP ${robotsResponse.status}`);
              const [xml, robots] = await Promise.all([sitemapResponse.text(), robotsResponse.text()]);
              const urls = [...xml.matchAll(/<loc>([^<]+)<\/loc>/g)].map((match) => match[1]);
              const communes = urls.filter((url) => url.includes('/weather/algeria/communes/'));
              if (!xml.startsWith('<?xml') || !xml.includes('<urlset')) throw new Error('Published sitemap XML is missing or malformed');
              if (communes.length !== 1708) throw new Error(`Published sitemap has ${communes.length} commune URLs; expected 1,708`);
              if (new Set(urls).size !== urls.length) throw new Error('Published sitemap contains duplicate URLs');
              if (urls.length !== 2000) throw new Error(`Published sitemap has ${urls.length} total URLs; expected 2,000`);
              const robotLines = robots.split(/\r?\n/).map((line) => line.trim());
              if (!robotLines.includes('User-agent: *')) throw new Error('Published robots.txt is missing User-agent: *');
              if (!robotLines.includes('Allow: /')) throw new Error('Published robots.txt is missing Allow: /');
              if (!robotLines.includes('Sitemap: ' + sitemapUrl)) throw new Error('Published robots.txt sitemap directive is incorrect');
              console.log(`Published sitemap verified: HTTP 200, ${communes.length} commune URLs, ${urls.length} total URLs`);
              console.log('Published robots.txt verified: HTTP 200, crawl access allowed, sitemap directive correct');
              process.exit(0);
            } catch (error) {
              lastError = error;
              console.log(`Published-file verification attempt ${attempt}/12: ${error.message}`);
              if (attempt < 12) await sleep(10000);
            }
          }
          throw new Error(`Published sitemap/robots verification failed after 12 attempts: ${lastError?.message}`);
          NODE
      - name: Verify all 1,708 published commune pages
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          GITHUB_SHA: ${{ github.sha }}
        run: npm run verify:published-communes
