name: Site quality checks

on:
  push:
    branches: [main, codex/phase-1-service-worker-cache, codex/phase-2-image-resource-loading]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    name: Static site validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate and validate all static city and commune pages
        run: npm run validate
