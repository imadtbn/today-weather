name: Lighthouse performance audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/js/**'
      - 'sw.js'
      - 'tests/**'
      - '.github/workflows/lighthouse.yml'
  schedule:
    - cron: '30 4 * * 1'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'sw.js'
      - 'tests/**'
      - 'scripts/validate-site.mjs'
      - 'scripts/audit-resources.mjs'
      - 'scripts/optimize-images.mjs'
      - 'images/**'
      - 'package.json'
      - 'data/**'
      - 'scripts/generate-city-pages.mjs'
      - 'sitemap.xml'
      - '.github/workflows/lighthouse.yml'

permissions:
  contents: read

jobs:
  lighthouse:
    name: Pull request and site Lighthouse audit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Generate and optimize candidate pages and images
        run: |
          node scripts/generate-city-pages.mjs
          node scripts/optimize-images.mjs
          node scripts/audit-resources.mjs
      - name: Checkout base revision for an apples-to-apples comparison
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
      - name: Generate and optimize baseline pages and images
        if: github.event_name == 'pull_request'
        run: |
          ln -s "$GITHUB_WORKSPACE/node_modules" "$GITHUB_WORKSPACE/baseline/node_modules"
          cd "$GITHUB_WORKSPACE/baseline"
          node scripts/generate-city-pages.mjs
          node scripts/optimize-images.mjs
          node scripts/audit-resources.mjs
      - name: Install Lighthouse
        run: npm install --global lighthouse
      - name: Start candidate preview server
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE" > /tmp/today-weather-candidate.log 2>&1 &
          curl --retry 20 --retry-delay 1 --retry-connrefused -fsS http://127.0.0.1:4173/ > /dev/null
      - name: Start baseline preview server
        if: github.event_name == 'pull_request'
        run: |
          nohup python3 -m http.server 4174 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE/baseline" > /tmp/today-weather-baseline.log 2>&1 &
          curl --retry 20 --retry-delay 1 --retry-connrefused -fsS http://127.0.0.1:4174/ > /dev/null
      - name: Create report directory
        run: mkdir -p lighthouse-reports
      - name: Run baseline mobile Lighthouse
        if: github.event_name == 'pull_request'
        run: |
          lighthouse http://127.0.0.1:4174/ \
            --preset=perf \
            --only-categories=performance,accessibility,best-practices,seo \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --output=json --output=html \
            --output-path=./lighthouse-reports/baseline-mobile
      - name: Run candidate mobile Lighthouse
        run: |
          lighthouse http://127.0.0.1:4173/ \
            --preset=perf \
            --only-categories=performance,accessibility,best-practices,seo \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --output=json --output=html \
            --output-path=./lighthouse-reports/candidate-mobile
      - name: Run baseline desktop Lighthouse
        if: github.event_name == 'pull_request'
        run: |
          lighthouse http://127.0.0.1:4174/ \
            --preset=desktop \
            --only-categories=performance,accessibility,best-practices,seo \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --output=json --output=html \
            --output-path=./lighthouse-reports/baseline-desktop
      - name: Run candidate desktop Lighthouse
        run: |
          lighthouse http://127.0.0.1:4173/ \
            --preset=desktop \
            --only-categories=performance,accessibility,best-practices,seo \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --output=json --output=html \
            --output-path=./lighthouse-reports/candidate-desktop
      - name: Print score summary
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const target of ['baseline', 'candidate']) {
            for (const device of ['mobile', 'desktop']) {
              const path = `lighthouse-reports/${target}-${device}.report.json`;
              if (!fs.existsSync(path)) continue;
              const report = JSON.parse(fs.readFileSync(path, 'utf8'));
              const scores = report.categories;
              const value = key => Math.round((scores[key]?.score ?? 0) * 100);
              console.log(`${target} ${device}: Performance ${value('performance')} | Accessibility ${value('accessibility')} | Best Practices ${value('best-practices')} | SEO ${value('seo')}`);
              for (const id of ['largest-contentful-paint', 'total-blocking-time', 'cumulative-layout-shift', 'speed-index']) {
                const audit = report.audits[id];
                if (audit) console.log(`  ${audit.title}: ${audit.displayValue || audit.numericValue}`);
              }
            }
          }
          NODE
      - name: Upload Lighthouse HTML and JSON reports
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lighthouse-reports/
          retention-days: 30
